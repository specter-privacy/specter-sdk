[package]
name = "specter-wasm"
version = "0.2.0"
edition = "2021"
authors = ["SPECTER Team"]
license = "Apache-2.0"
description = "WebAssembly bridge over specter-core + specter-crypto for the @specterpq/sdk TypeScript package."
repository = "https://github.com/specter-privacy/specter-sdk"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
specter-core = { path = "../../vendor/specter-core" }
specter-crypto = { path = "../../vendor/specter-crypto" }

wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
hex = "0.4"
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
console_error_panic_hook = { version = "0.1", optional = true }

# Browser RNG: enabling the `js` feature on getrandom routes
# `rand::thread_rng()` (used inside specter-crypto) through
# `crypto.getRandomValues`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["console_panic_hook"]
console_panic_hook = ["dep:console_error_panic_hook"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]

[package.metadata.docs.rs]
all-features = true
