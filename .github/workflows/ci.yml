name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  vendor-verify:
    name: Vendor pin verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify vendor matches pinned SHA
        run: bash scripts/verify-vendor.sh

  rust-fmt-clippy:
    name: Rust fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: rust-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: cargo fmt --check
        run: cargo fmt --manifest-path rust/specter-wasm/Cargo.toml -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path rust/specter-wasm/Cargo.toml --all-targets -- -D warnings

  rust-test:
    name: Rust unit tests (host)
    runs-on: ubuntu-latest
    needs: rust-fmt-clippy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: rust-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: cargo test (host targets)
        run: cargo test --manifest-path rust/specter-wasm/Cargo.toml --lib --bins

  wasm-build:
    name: WASM build (web + nodejs)
    runs-on: ubuntu-latest
    needs: rust-fmt-clippy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: rust-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM (web + nodejs)
        run: pnpm build:wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: packages/sdk/src/wasm
          if-no-files-found: error
          retention-days: 7

  wasm-browser-test:
    name: WASM tests (Node runtime)
    runs-on: ubuntu-latest
    needs: rust-fmt-clippy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: rust-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Run WASM tests (Node)
        run: wasm-pack test rust/specter-wasm --node

  ts-build-test-lint:
    name: TypeScript build + test + lint
    runs-on: ubuntu-latest
    needs: [wasm-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain (for build:wasm fallback)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: rust-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts
          path: packages/sdk/src/wasm

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm -r --filter "./packages/**" lint

      - name: Build SDK (skips wasm rebuild — artifacts already present)
        run: pnpm -r --filter "./packages/**" build

      - name: Test with coverage
        run: pnpm -r --filter "./packages/**" test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-coverage
          path: packages/sdk/coverage
          if-no-files-found: ignore
          retention-days: 7

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs:
      - vendor-verify
      - rust-fmt-clippy
      - rust-test
      - wasm-build
      - wasm-browser-test
      - ts-build-test-lint
    if: always()
    steps:
      - name: Aggregate result
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs succeeded."
