name: Sync vendored backend

on:
  schedule:
    # Daily at 06:00 UTC. Adjust as needed.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Optional 40-char commit SHA of pranshurastogi/SPECTER to vendor. Leave blank to use latest main.'
        required: false
        type: string
      ref:
        description: 'Optional branch/tag of pranshurastogi/SPECTER (default: main).'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-backend
  cancel-in-progress: false

env:
  BACKEND_REPO: pranshurastogi/SPECTER
  CARGO_TERM_COLOR: always

jobs:
  sync:
    name: Vendor backend + open PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: rust-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve target SHA
        id: resolve
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-main}"
          if [ -n "${INPUT_SHA:-}" ]; then
            SHA="${INPUT_SHA}"
          else
            SHA="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${BACKEND_REPO}/commits/${REF}" \
              | jq -er '.sha')"
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved SHA is not a 40-char hex: $SHA" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved $BACKEND_REPO@$REF -> $SHA"

      - name: Read current pinned SHA
        id: current
        run: |
          set -euo pipefail
          if [ -f vendor/VENDORED_AT.json ]; then
            CUR_SHA="$(jq -er '.sha' vendor/VENDORED_AT.json)"
          else
            CUR_SHA="none"
          fi
          echo "sha=$CUR_SHA" >> "$GITHUB_OUTPUT"
          echo "Currently pinned: $CUR_SHA"

      - name: Skip if already up-to-date
        if: steps.current.outputs.sha == steps.resolve.outputs.sha
        run: |
          echo "vendor/ is already pinned at ${{ steps.resolve.outputs.sha }}; nothing to do."

      - name: Run sync-backend.sh
        if: steps.current.outputs.sha != steps.resolve.outputs.sha
        env:
          BACKEND_SHA: ${{ steps.resolve.outputs.sha }}
          BACKEND_REF: ${{ steps.resolve.outputs.ref }}
          SKIP_TS: '1'
        run: |
          bash scripts/sync-backend.sh

      - name: Detect changes
        if: steps.current.outputs.sha != steps.resolve.outputs.sha
        id: changes
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain vendor/)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "vendor/ already matches the resolved SHA on disk; nothing to commit."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "vendor/ changed; will open a PR."
          fi

      - name: Create pull request
        if: |
          steps.current.outputs.sha != steps.resolve.outputs.sha &&
          steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/vendor-sync-${{ steps.resolve.outputs.sha }}
          base: main
          title: 'chore(vendor): sync backend to ${{ steps.resolve.outputs.sha }}'
          commit-message: |
            chore(vendor): sync backend to ${{ steps.resolve.outputs.sha }}

            Re-vendors specter-core and specter-crypto from
            ${{ env.BACKEND_REPO }}@${{ steps.resolve.outputs.ref }}
            (${{ steps.resolve.outputs.sha }}).

            Generated by .github/workflows/sync-backend.yml.
          body: |
            ## Backend sync

            This automated PR re-vendors `specter-core` and `specter-crypto`
            from [`${{ env.BACKEND_REPO }}`][repo] to commit
            [`${{ steps.resolve.outputs.sha }}`][commit].

            **Previous pin:** `${{ steps.current.outputs.sha }}`
            **New pin:** `${{ steps.resolve.outputs.sha }}`
            **Branch:** `${{ steps.resolve.outputs.ref }}`

            CI will run on this PR. Merge only after:

            - All CI jobs pass (rust fmt+clippy, rust tests, wasm build,
              wasm browser tests, TS build/test/lint, vendor verify).
            - You have skimmed the diff for unexpected changes (especially
              new `unsafe` blocks, panics, or network calls).
            - Any breaking changes in the backend protocol have been
              reflected in `@specterpq/sdk` (and a changeset added).

            [repo]: https://github.com/${{ env.BACKEND_REPO }}
            [commit]: https://github.com/${{ env.BACKEND_REPO }}/commit/${{ steps.resolve.outputs.sha }}
          labels: |
            automated
            vendor-sync
          add-paths: |
            vendor
          delete-branch: true
          signoff: false
