name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Version + publish
    runs-on: ubuntu-latest
    if: github.repository == 'specter-privacy/specter-sdk'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: rust-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install wasm-pack v0.14.0
        run: |
          curl -fsSL "https://github.com/rustwasm/wasm-pack/releases/download/v0.14.0/wasm-pack-v0.14.0-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/wasm-pack.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          install -m755 /tmp/wasm-pack-v0.14.0-x86_64-unknown-linux-musl/wasm-pack ~/.cargo/bin/wasm-pack
          wasm-pack --version

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify vendored backend matches pin
        run: bash scripts/verify-vendor.sh

      - name: Build WASM (web + nodejs)
        run: pnpm build:wasm

      - name: Build SDK (tsup + copy WASM)
        run: pnpm -r --filter "./packages/**" build

      - name: Run test suite
        run: pnpm -r --filter "./packages/**" test

      - name: Lint
        run: pnpm -r --filter "./packages/**" lint

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Summarise outcome
        if: always()
        run: |
          if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
            echo "Published the following packages:"
            echo "${{ steps.changesets.outputs.publishedPackages }}"
          elif [ "${{ steps.changesets.outputs.hasChangesets }}" = "true" ]; then
            echo "Release PR created or updated."
          else
            echo "No changesets to release."
          fi
